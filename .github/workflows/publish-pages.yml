name: Publish Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production keeps the Pages key; checks on other refs do not delay a release.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Validate production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runtime syntax
        run: npm run check
      - name: Test discovery gate
        run: python3 scripts/test-discovery-gate.py
      - name: Build and validate public files
        run: npm run build
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify Living Architecture against the public artifact
        working-directory: dist
        run: |
          node ../scripts/preview.mjs --host 127.0.0.1 --port 4174 > /tmp/profile-preview.log 2>&1 &
          PROFILE_PREVIEW_PID=$!
          trap 'kill "$PROFILE_PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/profile/ > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix .. run test:profile
          npm --prefix .. run test:profile-thai
          npm --prefix .. run test:profile-possibility
          npm --prefix .. run test:profile-finale
          npm --prefix .. run test:profile-alchemy
          npm --prefix .. run test:profile-handoff
          npm --prefix .. run test:profile-camera
          npm --prefix .. run test:profile-performance
          npm --prefix .. run test:profile-floors
          npm --prefix .. run test:profile-drama
          npm --prefix .. run test:profile-perspective
          npm --prefix .. run test:profile-reading-thread
          npm --prefix .. run test:profile-opening
          npm --prefix .. run test:profile-cinematic
          npm --prefix .. run test:profile-hand-light
          npm --prefix .. run test:profile-glove
          npm --prefix .. run test:profile-documentary
          npm --prefix .. run test:profile-painter
          npm --prefix .. run test:profile-accessibility
          npm --prefix .. run test:profile-completion
          ENGINE=chromium PUBLIC_ARTIFACT=1 TEST_URL=http://127.0.0.1:4174/ node ../scripts/qa-professional-profile.cjs
      - name: Upload validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # The builder permits only .nojekyll among hidden paths.
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy production artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
